spring.application.name=datedeals

spring.datasource.url=jdbc:postgresql://localhost:5432/datedealsdb

spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# spring.datasource.username=
# spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

# JWT Configuration
jwt.secret=YourSecretKeyForJWTTokenGenerationShouldBeAtLeast256BitsLongForHS512Algorithm
jwt.expiration=86400000

# inside docker container. Map in docker-composer to location on server
# logging.file.name=/home/logs/log.txt
# logging.file.name=

# logging.group.all=org.springframework.web,org.hibernate,com.hemp.hemp_app,c.h.h.e
logging.level.all=INFO


spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
# spring.mail.username=
# spring.mail.password=
spring.mail.host=smtpout.secureserver.net
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtpout.secureserver.net

# OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false