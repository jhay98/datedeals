<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .coupon {
            background: white;
            border: 3px dashed #333;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .business-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .deal-title {
            font-size: 20px;
            color: #666;
        }
        .coupon-code {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 4px;
            background: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .qr-code-container {
            text-align: center;
            padding: 20px 0;
        }
        .qr-code {
            width: 200px;
            height: 200px;
            border: 2px solid #333;
            border-radius: 5px;
        }
        .details {
            margin: 20px 0;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .label {
            font-weight: bold;
            color: #666;
        }
        .value {
            color: #333;
        }
        .status {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
        .status.active {
            background: #4CAF50;
            color: white;
        }
        .status.redeemed {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <div class="coupon">
        <div class="header">
            <div class="business-name">{{businessName}}</div>
            <div class="deal-title">{{dealTitle}}</div>
        </div>
        
        <div class="coupon-code">{{couponCode}}</div>
        
        <div class="qr-code-container">
            <img src="{{qrCode}}" alt="QR Code" class="qr-code"/>
        </div>
        
        <div class="details">
            <div class="detail-row">
                <span class="label">Purchase Price:</span>
                <span class="value">{{purchasePrice}}</span>
            </div>
            <div class="detail-row">
                <span class="label">Value:</span>
                <span class="value">{{valuePrice}}</span>
            </div>
            <div class="detail-row">
                <span class="label">Issue Date:</span>
                <span class="value">{{issueDate}}</span>
            </div>
            <div class="detail-row">
                <span class="label">Expiry Date:</span>
                <span class="value">{{expireDate}}</span>
            </div>
            <div class="detail-row">
                <span class="label">Address:</span>
                <span class="value">{{businessAddress}}</span>
            </div>
            <div class="detail-row">
                <span class="label">Email:</span>
                <span class="value">{{businessEmail}}</span>
            </div>
            <div class="detail-row">
                <span class="label">Phone:</span>
                <span class="value">{{businessPhone}}</span>
            </div>
        </div>
        
        <div class="status {{redeemed}}">{{redeemed}}</div>
    </div>
</body>
</html>
