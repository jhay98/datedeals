<div class="business-edit-container">
  <header class="header">
    <div class="header-content">
      <h1>Admin - Edit Business</h1>
      <nav class="nav">
        <a routerLink="/admin/businesses" routerLinkActive="active" class="nav-link">Businesses</a>
        <a routerLink="/admin/deals" routerLinkActive="active" class="nav-link">Deals</a>
        <a routerLink="/admin/coupons" routerLinkActive="active" class="nav-link">Coupons</a>
        <a routerLink="/admin/users" routerLinkActive="active" class="nav-link">Users</a>
        <button class="btn-logout" (click)="logout()">Logout</button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="form-container">
      <h2>Edit Business</h2>

      @if (isLoading) {
        <div class="loading-message">Loading business details...</div>
      }

      @if (successMessage) {
        <div class="success-message">{{ successMessage }}</div>
      }

      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      @if (!isLoading) {
        <form (ngSubmit)="onSubmit()" #businessForm="ngForm">
          <div class="form-group">
            <label for="businessName">Business Name *</label>
            <input
              type="text"
              id="businessName"
              name="businessName"
              [(ngModel)]="business.businessName"
              required
              [disabled]="isSubmitting"
              placeholder="e.g., The Coffee House"
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="contactEmail">Contact Email *</label>
              <input
                type="email"
                id="contactEmail"
                name="contactEmail"
                [(ngModel)]="business.contactEmail"
                required
                [disabled]="isSubmitting"
                placeholder="e.g., contact@example.com"
              />
            </div>

            <div class="form-group">
              <label for="contactPhone">Contact Phone *</label>
              <input
                type="tel"
                id="contactPhone"
                name="contactPhone"
                [(ngModel)]="business.contactPhone"
                required
                [disabled]="isSubmitting"
                placeholder="e.g., +27 123 456 789"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="address">Address *</label>
            <input
              type="text"
              id="address"
              name="address"
              [(ngModel)]="business.address"
              required
              [disabled]="isSubmitting"
              placeholder="e.g., 123 Main Street, Cape Town"
            />
          </div>

          <div class="form-group">
            <label for="description">Description *</label>
            <textarea
              id="description"
              name="description"
              [(ngModel)]="business.description"
              required
              [disabled]="isSubmitting"
              rows="6"
              placeholder="Enter a detailed description of the business..."
            ></textarea>
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="btn-secondary"
              [disabled]="isSubmitting"
              routerLink="/admin/businesses"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="btn-primary"
              [disabled]="!businessForm.form.valid || isSubmitting"
            >
              @if (isSubmitting) {
                <span>Updating...</span>
              } @else {
                <span>Update Business</span>
              }
            </button>
          </div>
        </form>
      }
    </div>
  </main>
</div>
