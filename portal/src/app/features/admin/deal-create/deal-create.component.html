<div class="deal-create-container">
  <header class="header">
    <div class="header-content">
      <h1>Admin - Create Deal</h1>
      <nav class="nav">
        <a routerLink="/admin/businesses" routerLinkActive="active" class="nav-link">Businesses</a>
        <a routerLink="/admin/deals" routerLinkActive="active" class="nav-link">Deals</a>
        <a routerLink="/admin/coupons" routerLinkActive="active" class="nav-link">Coupons</a>
        <a routerLink="/admin/users" routerLinkActive="active" class="nav-link">Users</a>
        <button class="btn-logout" (click)="logout()">Logout</button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="form-container">
      <h2>Create New Deal</h2>

      @if (successMessage) {
        <div class="success-message">{{ successMessage }}</div>
      }

      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      <form (ngSubmit)="onSubmit()" #dealForm="ngForm">
        <div class="form-row">
          <div class="form-group">
            <label for="code">Deal Code *</label>
            <input
              type="text"
              id="code"
              name="code"
              [(ngModel)]="deal.code"
              required
              [disabled]="isSubmitting"
              placeholder="e.g., SUMMER2024"
            />
          </div>

          <div class="form-group">
            <label for="title">Deal Title *</label>
            <input
              type="text"
              id="title"
              name="title"
              [(ngModel)]="deal.title"
              required
              [disabled]="isSubmitting"
              placeholder="e.g., Summer Special Offer"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="businessId">Business *</label>
          <select
            id="businessId"
            name="businessId"
            [(ngModel)]="deal.businessId"
            required
            [disabled]="isSubmitting || isLoadingBusinesses"
          >
            <option [ngValue]="0">-- Select a business --</option>
            @for (business of businesses; track business.businessId) {
              <option [ngValue]="business.businessId">{{ business.businessName }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="htmlVoucherTemplate">
            HTML Voucher Template
            <span class="info-tooltip" [title]="templateVariablesHelp">ℹ️</span>
          </label>
          <textarea
            id="htmlVoucherTemplate"
            name="htmlVoucherTemplate"
            [(ngModel)]="deal.htmlVoucherTemplate"
            [disabled]="isSubmitting"
            rows="6"
            [placeholder]="templatePlaceholder"
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="expiryDate">Expiry Date</label>
            <input
              type="datetime-local"
              id="expiryDate"
              name="expiryDate"
              [(ngModel)]="deal.expiryDate"
              [disabled]="isSubmitting"
            />
          </div>

          <div class="form-group">
            <label for="lifetimeDays">Lifetime (Days)</label>
            <input
              type="number"
              id="lifetimeDays"
              name="lifetimeDays"
              [(ngModel)]="deal.lifetimeDays"
              [disabled]="isSubmitting"
              min="0"
              placeholder="e.g., 30"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="commissionPercentage">Commission Percentage</label>
          <input
            type="number"
            id="commissionPercentage"
            name="commissionPercentage"
            [(ngModel)]="deal.commissionPercentage"
            [disabled]="isSubmitting"
            min="0"
            max="100"
            step="0.01"
            placeholder="e.g., 15.50"
          />
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn-secondary"
            [disabled]="isSubmitting"
            routerLink="/admin/deals"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn-primary"
            [disabled]="!dealForm.form.valid || isSubmitting"
          >
            @if (isSubmitting) {
              <span>Creating...</span>
            } @else {
              <span>Create Deal</span>
            }
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
